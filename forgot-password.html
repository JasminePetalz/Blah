<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Previous Save</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#171d17">
  <link rel="stylesheet" href="style.css?v=45">
</head>
<body>
  <nav class="main-nav">
    <div class="site-width nav-inner">
      <a href="index.html">HOME</a>
      <a href="games.html">GAMES</a>
      <a href="community.html">COMMUNITY</a>
      <a href="forum.html">FORUM</a>
      <a href="profile.html">PROFILE</a>
    </div>
  </nav>

  <main class="auth-page">
    <section class="auth-box">
      <a class="auth-logo" href="index.html">PREVIOUS SAVE</a>
      <p class="auth-kicker">ACCOUNT RECOVERY</p>
      <h1>Reset your password</h1>
      <p class="auth-intro">
        Enter the email attached to your account. We’ll send you a secure
        link to choose a new password.
      </p>

      <form id="forgot-password-form">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <button id="forgot-password-button" type="submit">
          SEND RESET LINK
        </button>

        <p
          id="forgot-password-message"
          class="auth-message"
          aria-live="polite"
        ></p>
      </form>

      <p class="auth-switch">
        Remembered your password?
        <a href="login.html">Log in</a>
      </p>

      <a class="auth-back" href="index.html">← Back to home</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=7"></script>
  <script src="js/forgot-password.js?v=2"></script>
</body>
</html>
