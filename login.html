<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Log In | Previous Save</title>

  <link rel="stylesheet" href="style.css?v=46">
</head>

<body>

  <nav class="main-nav">
    <div class="site-width nav-inner">
      <a href="index.html">HOME</a>
      <a href="games.html">GAMES</a>
      <a href="community.html">COMMUNITY</a>
      <a href="forum.html">FORUM</a>
      <a href="profile.html">PROFILE</a>
    </div>
  </nav>

  <main class="auth-page">

    <section class="auth-box">

      <a class="auth-logo" href="index.html">
        PREVIOUS SAVE
      </a>

      <h1>Log in</h1>

      <p class="auth-intro">
        Sign in to view your profile, reviews, clips, and posts.
      </p>

      <form id="login-form">

        <label for="login-email">
          Email
        </label>

        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="login-password">
          Password
        </label>

        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <div class="forgot-password-row">
          <a href="forgot-password.html">
            Forgot password?
          </a>
        </div>

        <button type="submit">
          LOG IN
        </button>

        <p
          class="auth-message"
          id="login-message"
          aria-live="polite"
        ></p>

      </form>

      <p class="auth-switch">
        Need an account?

        <a href="signup.html">
          Sign up
        </a>
      </p>

      <a class="auth-back" href="index.html">
        ← Back to home
      </a>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js?v=8"></script>

  <script src="js/auth.js?v=6"></script>

</body>
</html>
