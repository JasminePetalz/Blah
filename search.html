<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Search | 360 Archive</title>

  <link
    rel="stylesheet"
    href="style.css?v=16"
  >
</head>

<body>
  <div class="top-bar">
    <div class="site-width top-bar-inner">
      <span>360 ARCHIVE</span>

      <span class="online-status">
        <span class="online-dot"></span>
        ONLINE
      </span>
    </div>
  </div>

  <header class="site-header">
    <div class="site-width header-inner">
      <a
        class="site-logo"
        href="index.html"
      >
        <span class="logo-circle">
          X
        </span>

        <span class="logo-name">
          <strong>360</strong>
          <span>ARCHIVE</span>
        </span>
      </a>

      <div class="header-text">
        <p>
          Find games, people, and community tags
        </p>

        <span>
          search the archive
        </span>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <div class="site-width nav-inner">
      <a href="index.html">
        HOME
      </a>

      <a href="games.html">
        GAMES
      </a>

      <a href="community.html">
        COMMUNITY
      </a>

      <a href="forum.html">
        FORUM
      </a>

      <a href="profile.html">
        PROFILE
      </a>
    </div>
  </nav>

  <main class="site-width search-page">
    <section class="search-hero">
      <p class="small-heading">
        DISCOVER 360 ARCHIVE
      </p>

      <h1>
        Search
      </h1>

      <form
        id="archive-search-form"
        class="archive-search-form"
      >
        <input
          id="archive-search-input"
          type="search"
          placeholder="Search games, people, or tags..."
          autocomplete="off"
        >

        <button type="submit">
          SEARCH
        </button>
      </form>

      <div
        id="archive-search-filters"
        class="archive-search-filters"
        role="tablist"
        aria-label="Search result type"
      >
        <button
          class="active"
          type="button"
          data-search-type="all"
        >
          ALL
        </button>

        <button
          type="button"
          data-search-type="people"
        >
          PEOPLE
        </button>

        <button
          type="button"
          data-search-type="games"
        >
          GAMES
        </button>

        <button
          type="button"
          data-search-type="tags"
        >
          TAGS
        </button>

        <button
          type="button"
          data-search-type="articles"
          disabled
        >
          ARTICLES
        </button>

        <button
          type="button"
          data-search-type="clips"
          disabled
        >
          CLIPS
        </button>
      </div>
    </section>

    <p
      id="archive-search-message"
      class="form-message"
      aria-live="polite"
    ></p>

    <div
      id="archive-search-results"
      class="archive-search-results"
    ></div>
  </main>

  <footer>
    <div class="site-width footer-inner">
      <p>
        360 Archive © 2026
      </p>

      <p>
        360 Archive is an unofficial fan project and is not
        affiliated with, endorsed by, or sponsored by Microsoft
        or Xbox.
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/search.js?v=1"></script>
</body>
</html>
