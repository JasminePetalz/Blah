<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign Up | Previous Save</title>

  <link rel="stylesheet" href="style.css?v=50">
</head>

<body>

  <nav class="main-nav">
    <div class="site-width nav-inner">
      <a href="index.html">HOME</a>
      <a href="games.html">GAMES</a>
      <a href="community.html">COMMUNITY</a>
      <a href="forum.html">FORUM</a>
      <a href="profile.html">PROFILE</a>
    </div>
  </nav>

  <main class="auth-page">

    <section class="auth-box">

      <a class="auth-logo" href="index.html">
        PREVIOUS SAVE
      </a>

      <h1>Create an account</h1>

      <p class="auth-intro">
        Make a profile, add games and join discussions.
      </p>


      <form id="signup-form">

        <label for="signup-username">
          Username
        </label>

        <input
          id="signup-username"
          name="username"
          type="text"
          minlength="3"
          maxlength="30"
          autocomplete="username"
          required
        >


        <label for="signup-email">
          Email
        </label>

        <input
          id="signup-email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >


        <label for="signup-password">
          Password
        </label>

        <input
          id="signup-password"
          name="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <span class="input-note">
          Use at least 8 characters.
        </span>


        <button type="submit">
          CREATE ACCOUNT
        </button>


        <p
          class="auth-message"
          id="signup-message"
          aria-live="polite"
        ></p>

      </form>


      <p class="auth-switch">

        Already have an account?

        <a href="login.html">
          Log in
        </a>

      </p>


      <a class="auth-back" href="index.html">
        ← Back to home
      </a>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js?v=50"></script>

  <script src="js/auth.js?v=4"></script>

</body>
</html>
